<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
  <title id="title">Run the workflow. Grow what it knows.</title>
  <desc id="desc">Each run decides, acts through agents, APIs or RPA, and verifies with checks and targeted review. Evidence from all three stages feeds a portable ledger. Across runs, record and link experience, map decision states, and propose and test improvements. Adopt changes only within delegated authority, then feed them into future runs. Results remain observable and changes reversible. Mapping decision states informs investigation; tests establish whether changes help.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#536b7a"/></marker>
    <marker id="return-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28766b"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .heading { fill: #243b46; font-size: 28px; font-weight: 650; }
      .section { fill: #526976; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      .label { fill: #243b46; font-size: 21px; font-weight: 600; }
      .detail { fill: #526976; font-size: 16px; }
      .flow { fill: none; stroke: #536b7a; stroke-width: 2; marker-end: url(#arrow); }
      .capture { fill: none; stroke: #82959e; stroke-width: 1.7; stroke-dasharray: 5 5; }
    </style>
  </defs>
  <rect width="960" height="630" rx="18" fill="#f5f8fa"/>
  <text class="heading" x="72" y="49">Run the workflow. Grow what it knows.</text>
  <text class="detail" x="72" y="77">Experience becomes useful when it changes what happens next.</text>

  <text class="section" x="72" y="109">EACH RUN</text>
  <g fill="#ffffff" stroke="#b0bfc7" stroke-width="1.2">
    <rect x="72" y="124" width="240" height="82" rx="10"/>
    <rect x="360" y="124" width="240" height="82" rx="10"/>
    <rect x="648" y="124" width="240" height="82" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text class="label" x="192" y="158">Decide</text>
    <text class="detail" x="192" y="184">Evidence · context</text>
    <text class="label" x="480" y="158">Act</text>
    <text class="detail" x="480" y="184">Agents · APIs · RPA</text>
    <text class="label" x="768" y="158">Verify</text>
    <text class="detail" x="768" y="184">Checks · targeted review</text>
  </g>
  <path class="flow" d="M312 165H353"/>
  <path class="flow" d="M600 165H641"/>

  <path class="capture" d="M192 206V250H768V206M480 206V250"/>
  <path class="capture" d="M192 250V318" marker-end="url(#arrow)"/>
  <text class="detail" x="360" y="278">Carry evidence across every handoff</text>

  <text class="section" x="72" y="309">ACROSS RUNS</text>
  <g stroke-width="1.2">
    <rect x="72" y="326" width="240" height="100" rx="10" fill="#e9f0f6" stroke="#a3b6c7"/>
    <rect x="360" y="326" width="240" height="100" rx="10" fill="#eeedf7" stroke="#b4afcf"/>
    <rect x="648" y="326" width="240" height="100" rx="10" fill="#e4f0eb" stroke="#9bbdb3"/>
  </g>
  <g text-anchor="middle">
    <text class="label" x="192" y="365">Record &amp; link</text>
    <text class="detail" x="192" y="393">Evidence · outcomes</text>
    <text class="label" x="480" y="365">Map decision states</text>
    <text class="detail" x="480" y="393">Patterns · shifts · gaps</text>
    <text class="label" x="768" y="365">Propose &amp; test</text>
    <text class="detail" x="768" y="393">Rules · tools · bridges</text>
  </g>
  <path class="flow" d="M312 376H353"/>
  <path class="flow" d="M600 376H641"/>
  <path class="flow" d="M768 426V473"/>

  <rect x="648" y="481" width="240" height="76" rx="10" fill="#ffffff" stroke="#28766b" stroke-width="1.5"/>
  <text class="label" x="768" y="512" text-anchor="middle">Adopt the change</text>
  <text class="detail" x="768" y="538" text-anchor="middle">Within delegated authority</text>
  <path d="M648 519H42Q30 519 30 507V177Q30 165 42 165H65" fill="none" stroke="#28766b" stroke-width="2.4" marker-end="url(#return-arrow)"/>
  <text x="72" y="493" fill="#28766b" font-size="19" font-weight="600">Better runs. Earned trust.</text>
  <text class="detail" x="72" y="546">Observe results. Keep changes reversible.</text>

  <text class="detail" x="480" y="602" text-anchor="middle">Start with portable records. Keep the knowledge as tools change.</text>
</svg>
